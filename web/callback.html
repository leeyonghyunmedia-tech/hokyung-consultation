<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이메일 인증 · 법무법인 호경</title><style>body{font:16px/1.7 Arial,'Malgun Gothic',sans-serif;background:#f3f5f9;color:#162337;padding:32px}main{max-width:500px;margin:60px auto;background:white;padding:32px;border-radius:20px}input,button{font:inherit;width:100%;padding:12px;box-sizing:border-box;margin:8px 0;border-radius:8px;border:1px solid #ccd5e3}button{background:#2555d9;color:white}a{color:#2555d9}[hidden]{display:none}</style></head><body><main><h1>이메일 인증</h1><p id="status" role="status">인증 정보를 확인하고 있습니다.</p><form id="reset" hidden><label>새 비밀번호<input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><label>새 비밀번호 확인<input name="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><button>비밀번호 변경</button></form><a id="continue" href="/lp/hokyung" hidden>상담 신청 이어가기</a></main><script>
const params=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search),status=document.querySelector('#status'),form=document.querySelector('#reset'),link=document.querySelector('#continue');
const campaign=/^[a-z0-9][a-z0-9-]{0,63}$/.test(query.get('campaign')||'')?query.get('campaign'):'hokyung';link.href='/lp/'+campaign;
const payload={access_token:params.get('access_token'),refresh_token:params.get('refresh_token'),state:query.get('state')},recovery=params.get('type')==='recovery';history.replaceState(null,'','/auth/callback');
async function post(action,body){const r=await fetch('/api/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}
(async()=>{try{if(!payload.access_token||!payload.refresh_token)throw Error('인증 링크가 없거나 만료되었습니다. 신청 페이지에서 다시 요청해 주세요.');await post('session',payload);status.textContent=recovery?'새 비밀번호를 입력해 주세요.':'이메일 인증이 완료되었습니다. 상담 신청을 마무리해 주세요.';form.hidden=!recovery;link.hidden=recovery;}catch(e){status.textContent=e.message;link.hidden=false;}finally{payload.access_token=null;payload.refresh_token=null;}})();
form.onsubmit=async e=>{e.preventDefault();if(form.password.value!==form.confirm.value){status.textContent='비밀번호가 일치하지 않습니다.';return;}form.querySelector('button').disabled=true;try{await post('password',{password:form.password.value});form.reset();form.hidden=true;status.textContent='비밀번호가 변경되었습니다.';link.hidden=false;}catch(e){status.textContent=e.message;}finally{form.querySelector('button').disabled=false;}};
</script></body></html>
