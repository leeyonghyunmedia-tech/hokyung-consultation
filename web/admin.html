<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>법무법인 호경 · 관리자</title><link rel="icon" href="/favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#18243c;font-family:system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:24px}h2{font-size:20px}p{color:#5f6b80;line-height:1.6}section{background:white;padding:24px;border:1px solid #e1e6ef;border-radius:16px;margin-top:24px}label{display:block;margin:16px 0}input,select,button{font:inherit;border:1px solid #cfd7e5;border-radius:8px;padding:11px}input{display:block;width:100%;margin-top:8px}button{cursor:pointer;background:white;color:#1c48b1}button.primary{background:#2555d9;color:white;border-color:#2555d9}button:disabled{opacity:.5;cursor:wait}#login{max-width:440px;margin:64px auto}#message{padding:14px;border-radius:8px;background:#fff1e9;color:#8d341d;white-space:pre-wrap}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.table-wrap{overflow:auto;margin-top:20px}table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #e8ecf3}th{background:#f7f9fc}td.wrap{white-space:normal;min-width:150px;max-width:300px}.paging{display:flex;gap:12px;align-items:center;margin-top:20px}a{color:#2555d9}[hidden]{display:none!important}
</style></head><body><main><header><div><h1>법무법인 호경</h1><p>상담 신청 · 중간 이탈 · 회원 관리</p></div><button id="logout" hidden>로그아웃</button></header><p id="message" role="status" hidden></p><section id="login"><h2>관리자 로그인</h2><form id="login-form"><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required minlength="8"></label><button class="primary">로그인</button></form><p>관리자 권한이 부여된 계정만 조회할 수 있습니다.</p></section><section id="dashboard" hidden><div class="toolbar"><select id="view" aria-label="조회 대상"><option value="leads">상담·방문 내역</option><option value="members">회원 내역</option></select><select id="status" aria-label="신청 상태"><option value="all">전체 방문</option><option value="completed">신청 완료</option><option value="incomplete">진행 중·미완료</option><option value="abandoned">30분 이상 미완료</option></select><button id="refresh">새로고침</button><button id="download">현재 페이지 CSV 다운로드</button></div><p id="hint">질문 답변은 ‘다음’을 누를 때 저장됩니다. 30분 이상 미완료는 마지막 저장 이후 30분이 지난 방문입니다.</p><div class="table-wrap"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></div><div class="paging"><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></div><p>사용자 비밀번호는 조회하거나 다운로드할 수 없습니다. 한 페이지에 최대 100건을 표시합니다.</p></section><p><a href="/lp/hokyung">상담 페이지 열기</a></p></main><script>/* ADMIN_SCRIPT */</script></body></html>
